<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Noto Sans TC','PingFang TC',sans-serif">
<rect width="900" height="640" fill="#F4F1EA"/>
<!-- 街道 -->
<g stroke="#D8D2C4" stroke-width="22" stroke-linecap="round">
<line x1="690" y1="40" x2="690" y2="600"/><text/>
<line x1="60" y1="120" x2="840" y2="120"/>
<line x1="60" y1="470" x2="840" y2="470"/>
<line x1="330" y1="120" x2="330" y2="600"/>
</g>
<g fill="#8A8273" font-size="15"><text x="700" y="60">大津通</text><text x="760" y="110">若宮大通（高架）</text><text x="60" y="500">大須商店街 東西軸（仁王門通・万松寺通）</text><text x="340" y="600">本町通</text></g>
<!-- 商店街拱廊 -->
<rect x="150" y="440" width="560" height="60" rx="30" fill="#FFF3D6" stroke="#E8C98A" stroke-width="3"/>
<text x="430" y="478" text-anchor="middle" fill="#9A6A3C" font-size="18" font-weight="700">🛍️ 大須商店街（有屋頂拱廊，下雨也 OK）</text>
<!-- 路線 -->
<path d="M690 70 L690 130 L600 200 L560 330 L430 400 L220 470 L190 470 L330 470 L560 470 L640 400 L690 330 L690 230 L690 70" fill="none" stroke="#3F7D5C" stroke-width="6" stroke-dasharray="14 10" stroke-linejoin="round"/>
<!-- 站點 -->
<g font-size="17" fill="#18263A">
<circle cx="690" cy="70" r="16" fill="#B8524F"/><text x="690" y="76" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="712" y="76">矢場町站 M04（4 號出口）・最後從松坂屋 5/6 號出口回栄</text>
<circle cx="600" cy="200" r="16" fill="#B8524F"/><text x="600" y="206" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="622" y="206">🐰 三輪神社（找隱藏兔子）</text>
<circle cx="560" cy="330" r="16" fill="#B8524F"/><text x="560" y="336" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="582" y="336">萬松寺・招財貓廣場（拍照）</text>
<circle cx="220" cy="470" r="16" fill="#B8524F"/><text x="220" y="476" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="60" y="430">⛩️ 大須観音（鴿子）・甜甜圈</text>
<circle cx="640" cy="400" r="16" fill="#B8524F"/><text x="640" y="406" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="662" y="406">🐷 矢場とん 本店（午餐）</text>
<circle cx="690" cy="330" r="16" fill="#B8524F"/><text x="690" y="336" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="712" y="336">⚡ PARCO 東館 2F 寶可夢中心</text>
<circle cx="690" cy="230" r="16" fill="#B8524F"/><text x="690" y="236" text-anchor="middle" fill="#fff" font-weight="700">7</text><text x="712" y="236">🎁 松坂屋 本館（B1 伴手禮・7F 物產展）</text>
</g>
<text x="60" y="60" font-size="22" font-weight="700" fill="#18263A">11/11 大須一日 · 路線示意（不按比例）</text>
<text x="60" y="88" font-size="14" fill="#647387">北 ↑　矢場町站在東北角，大須観音在西南角，中間都是平路，推車可走。</text>
</svg>
