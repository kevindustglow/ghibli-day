name: fetch-zh-park
on:
  push:
    paths: ['.github/workflows/fetch-zh-park.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          sudo apt-get install -y poppler-utils >/dev/null
          mkdir -p tmpzh
          curl -fsSL -A "Mozilla/5.0" -o tmpzh/park-zh.pdf "https://www.aichi-koen.com/wp-content/uploads/2026/08/hangtai202604_compressed.pdf"
          pdfinfo tmpzh/park-zh.pdf
          pdftoppm -r 200 -png tmpzh/park-zh.pdf tmpzh/park-zh
          ls -la tmpzh
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add tmpzh && git commit -m "Add zh park map render" && git push origin HEAD:main
