name: fetch-stations
on:
  push:
    paths: ['.github/workflows/fetch-stations.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          sudo apt-get install -y poppler-utils >/dev/null
          mkdir -p tmpst; cd tmpst
          L=https://www.linimo.jp/language/tcn/assets/file
          for f in fujigaoka aichikyuhakukinenkoen fujigaoka02 aichikyuhakukinenkoen01; do curl -fsSL -A "Mozilla/5.0" -o $f.pdf $L/$f.pdf && pdftoppm -r 110 -png $f.pdf $f; done
          UA="Mozilla/5.0"
          for q in "%E6%A0%84" "%E8%97%A4%E3%81%8C%E4%B8%98"; do
            curl -fsSL -A "$UA" "https://www.kotsu.city.nagoya.jp/jp/pc/subway/station_map.html?name=$q" -o sm_$q.html
            curl -fsSL -A "$UA" "https://www.kotsu.city.nagoya.jp/jp/pc/subway/station_info.html?name=$q" -o si_$q.html
          done
          ls -la
          grep -ohE '[^"'"'"' ]+\.(pdf|png|jpg|gif)' *.html | sort -u | head -80
          rm -f *.pdf
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add tmpst && git commit -m "station refs" && git push origin HEAD:main
