<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名古屋八日</title>
<meta name="theme-color" content="#EEF3F7">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名古屋八日">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: left-hand phone page. Sticky top = brand + day chips. One day at a time as stacked cards. Bottom-left dock. */
:root{
  --sky-top:#CFE4F3; --grass:#8DBF7A; --acorn:#9A6A3C;
  --bg:#EEF3F7; --card:#FFFFFF; --ink:#18263A; --muted:#647387; --line:#D8E1EA;
  --forest:#3F7D5C; --forest-soft:#E1EFE6; --sky:#3C78B4; --sky-soft:#E0ECF7;
  --sun:#C9821C; --sun-soft:#FBEED6; --rose:#B8524F; --rose-soft:#F9E3E2;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1623; --card:#18222F; --ink:#E8EEF5; --muted:#93A2B5; --line:#283545;
  --forest:#86C7A2; --forest-soft:#1C2E27; --sky:#8DBBE8; --sky-soft:#1A2A3C;
  --sun:#F0B455; --sun-soft:#33281A; --rose:#F0908D; --rose-soft:#3A2224; --sky-top:#16243A; --grass:#3E6B47; --acorn:#C79A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1623; --card:#18222F; --ink:#E8EEF5; --muted:#93A2B5; --line:#283545;
  --forest:#86C7A2; --forest-soft:#1C2E27; --sky:#8DBBE8; --sky-soft:#1A2A3C;
  --sun:#F0B455; --sun-soft:#33281A; --rose:#F0908D; --rose-soft:#3A2224; --sky-top:#16243A; --grass:#3E6B47; --acorn:#C79A6B; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(to bottom,var(--sky-top),var(--bg) 300px) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
p,ul,ol{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:12px 120px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-inline:-16px;padding-inline:16px;border-radius:0 0 20px 20px;padding-block:6px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-size:1.35rem;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.pillbtn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--forest);color:#fff;font-size:.85rem;font-weight:600;text-decoration:none;white-space:nowrap}
.pillbtn:active{transform:scale(.97)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 13px;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:1px}
.chips button small{font-size:.68rem;letter-spacing:.04em}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.today{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}

.wx{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.wx .d{min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;font-size:.66rem;color:var(--muted);line-height:1.15;background:var(--card);border:1px solid var(--line)}
.wx .d.today{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.wx .d.past:not(.sel){opacity:.55}
.wx .d.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wx .d .i{font-size:1.2rem;line-height:1.2}
.wx .d b{font-family:var(--f-mono);font-size:.74rem;color:inherit;line-height:1.15}
.wx .d .r{font-size:.62rem}
.wx .d.sel b{color:var(--bg)}
.wx a.more{flex:none;align-self:center;font-size:.7rem;color:var(--muted);padding:0 6px;white-space:nowrap;line-height:1.3;text-align:center}
.wxday{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-top:-4px}
.wxday .i{font-size:1.3rem}
.wear{font-size:.9rem;color:var(--muted);margin-top:-6px;line-height:1.45}

/* cards */
.stack{display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:var(--card);border-radius:24px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line),0 10px 24px -18px rgba(24,38,58,.35)}
.card.hero{padding-bottom:26px;overflow:hidden}
.card.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:radial-gradient(circle at 10px 12px,var(--grass) 10px,transparent 11px) 0 0/20px 12px repeat-x;opacity:.55}
.card.maybe{background:transparent;border:2px dashed var(--line);box-shadow:none}
.card.warm{background:var(--sun-soft);box-shadow:none}
.card.ghibli{background:var(--forest-soft);box-shadow:none}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.eyebrow .dots{color:var(--sun);letter-spacing:2px;font-size:.7rem}
.tag{font-size:.75rem;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--forest-soft);color:var(--forest);white-space:nowrap}
.tag.sky{background:var(--sky-soft);color:var(--sky)}
.tag.sun{background:var(--sun-soft);color:var(--sun)}
.tag.rose{background:var(--rose-soft);color:var(--rose)}
.tag.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.hero h2{font-size:2rem;line-height:1.2}
.hero .ja{font-size:.95rem;color:var(--muted);margin-top:-6px}
.times{display:flex;gap:18px;flex-wrap:wrap}
.times div{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted)}
.times b{font-family:var(--f-mono);font-size:1.45rem;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.plan{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.plan li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline}
.plan .t{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .t.blank::before{content:"·";display:block;text-align:center}
.plan b{font-weight:500}
.plan small{display:block;font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:.95rem;text-decoration:none;flex:0 1 auto}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wide{flex:1 1 100%}
.btn.ghibli{background:var(--forest);color:#fff;border-color:var(--forest);min-height:56px;font-size:1.05rem}
.btn:active{transform:scale(.98)}
.pts{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{display:flex;gap:10px;align-items:flex-start;font-size:1rem}
.pts li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-top:.65em}
.note{font-size:.85rem;color:var(--muted)}
.must{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.must li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.must .rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun);font-size:.9rem}
.must li:first-child .rk{background:var(--sun);color:var(--card)}
.must b,.stops b{font-weight:700;display:block}
.jp{display:block;font-size:.85rem;color:var(--muted)}
.must small,.stops small{display:block;font-size:.85rem;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.stops{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.stops li{border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stops li.run{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stops li.over{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun);background:var(--sun-soft)}
.stops .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stops .t{font-size:1rem}
.stops .skip{margin:4px 0 0;font-size:.85rem;color:var(--sun)}
.stops .actions{justify-content:flex-start;margin-top:6px}
.tbtn{min-width:150px}
.pmap{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.pmap img{display:block;width:100%;height:auto}
.pmap .fb{display:none;padding:20px;text-align:center;font-size:.9rem}
.pmap.fail img{display:none}.pmap.fail .fb{display:block}
.card h3{font-size:1.15rem}

/* transport */
details.tr{border-top:1px solid var(--line);padding-top:10px}
details.tr summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px;font-weight:500}
details.tr summary::-webkit-details-marker{display:none}
details.tr summary .chev{transition:transform .2s;color:var(--muted)}
details.tr[open] summary .chev{transform:rotate(180deg)}
.route{list-style:none;padding:0;display:flex;flex-direction:column;margin-top:6px}
.route li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;position:relative}
.route li::before{content:"";position:absolute;left:14px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.route li:last-child::before{display:none}
.route .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;background:var(--sky-soft);color:var(--sky);position:relative;z-index:1}
.route .n.walk{background:var(--forest-soft);color:var(--forest)}
.route .n.taxi{background:var(--sun-soft);color:var(--sun)}
.route .n.fly{background:var(--rose-soft);color:var(--rose)}
.route b{display:block;font-weight:500;line-height:1.35}
.route small{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.route .code{font-family:var(--f-mono);font-size:.85em;background:var(--bg);padding:0 5px;border-radius:5px}
.fare{display:flex;gap:10px;align-items:flex-start;background:var(--sky-soft);border-radius:14px;padding:10px 12px;font-size:.9rem;margin-top:8px}
.fare svg{flex:none;color:var(--sky);margin-top:3px}
.fare ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.flag{font-size:.84rem;color:var(--sun);display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.flag::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--sun);margin-top:.5em}

/* overview list */
.days{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.days button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;min-height:72px}
.days button.big{border-color:var(--ink);border-width:2px}
.days button.past{opacity:.55}
.days .d{display:flex;flex-direction:column;line-height:1.1}
.days .d b{font-family:var(--f-mono);font-size:1.15rem}
.days .d small{font-size:.72rem;color:var(--muted)}
.days .m{display:flex;flex-direction:column;gap:3px;min-width:0}
.days .m b{font-weight:500;line-height:1.3}
.days .m small{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days .e{color:var(--sun);letter-spacing:2px;font-size:.7rem;white-space:nowrap}

/* prep */
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-family:var(--f-mono);font-size:3rem;line-height:1}
.chk{list-style:none;padding:0;display:flex;flex-direction:column}
.chk li{border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk label{display:flex;gap:12px;align-items:center;min-height:50px;padding:6px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--forest);margin:0}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.chk span{flex:1}
.chk span small{display:block;font-size:.82rem;color:var(--muted);text-decoration:none}
.chk .pill{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--sun);white-space:nowrap}
.group h3{display:flex;justify-content:space-between;align-items:baseline}
.group h3 small{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:6px 0;text-align:left}
.chk li{display:flex;align-items:center;gap:4px}
.chk label{flex:1;min-width:0}
.chk .del{flex:none;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:1.3rem;border-radius:50%;opacity:.6}
.chk .del:active{background:var(--rose-soft);color:var(--rose);opacity:1}
.chk.memo li{align-items:flex-start}
.chk .txt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 0;line-height:1.5;font-size:1rem}
.chk .edit{flex:1;min-width:0;min-height:46px;border:1px solid var(--forest);border-radius:12px;padding:0 12px;background:var(--bg);font-size:1rem;margin:4px 0}
.add{display:flex;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.add input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);font-size:1rem}
.add button{flex:none;width:46px;height:46px;border:0;border-radius:12px;background:var(--forest);color:#fff;font-size:1.3rem}

/* info */
.kv{display:flex;flex-direction:column;gap:8px}
.kv div{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:.95rem}
.kv dt{color:var(--muted);font-size:.85rem;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.78rem;margin-left:6px;vertical-align:middle}
.fares{list-style:none;padding:0}
.fares li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:.95rem}
.fares li:first-child{border-top:0}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:var(--card)}
.links a small{color:var(--muted);font-size:.8rem;white-space:nowrap}
.links a.hot{border-color:var(--forest);background:var(--forest-soft)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock nav{max-width:520px;margin:0 auto;display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px -14px rgba(24,38,58,.45)}
.dock button{flex:1;min-height:56px;border:0;border-radius:16px;background:none;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0}
.dock button svg{width:22px;height:22px}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" style="position:relative;isolation:isolate">
  <div class="top">
    <div class="top-row">
      <a class="brand" href="./" id="home" aria-label="回到首頁" style="text-decoration:none;color:inherit"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="3" fill="var(--sky-soft)" stroke="var(--sky)"/><path d="M9 7V5a3 3 0 0 1 6 0v2" stroke="var(--sky)"/><path d="M9 11v6M15 11v6" stroke="var(--sky)"/><circle cx="8" cy="21" r="1" fill="var(--sky)" stroke="none"/><circle cx="16" cy="21" r="1" fill="var(--sky)" stroke="none"/></svg>名古屋八日</a>
      <div style="display:flex;gap:6px"><button class="pillbtn" id="mapbtn" type="button" style="background:var(--sky)">🗺️ 地圖</button><a class="pillbtn" id="jalink" href="ja.html?v=23">🗣️ 日文會話</a></div>
    </div>
    <div class="wx" id="wx" role="group" aria-label="選擇日期"></div>
  </div>

  <section id="v-day" class="stack"></section>
  <section id="v-all" class="stack" hidden></section>
  <section id="v-prep" class="stack" hidden></section>
  <section id="v-info" class="stack" hidden></section>
</div>

<div class="dock"><nav aria-label="切換畫面" id="dock">
  <button data-view="day" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg>今天</button>
  <button data-view="all" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>八天</button>
  <button data-view="prep" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/></svg>準備</button>
  <button data-view="info" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>資訊</button>
</nav></div>
<div class="toast" id="toast" role="status"></div>

// ===== 天氣（Open-Meteo，免金鑰；名古屋 35.17,136.91）=====
// 主模型 ECMWF AIFS（AI 模型，Kevin 指定）；降雨機率 AIFS 單一模型沒有，從 best_match 補；AIFS 失敗就整個用 best_match
const WX_BASE = "https://api.open-meteo.com/v1/forecast?latitude=35.17&longitude=136.91&timezone=Asia%2FTokyo&forecast_days=16&past_days=8";
const WX_URL_AI = WX_BASE + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&models=ecmwf_aifs025_single";
const WX_URL_BM = WX_BASE + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max";
const ACCU = "https://www.accuweather.com/zh/jp/nagoya-shi/223191/daily-weather-forecast/223191";
const WX_ICON = c => c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=49?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=79?"🌨️":c<=82?"🌧️":c<=86?"🌨️":"⛈️";
const WX_TXT = c => c===0?"晴":c<=2?"多雲時晴":c===3?"陰":c<=49?"霧":c<=57?"毛毛雨":c<=67?"雨":c<=79?"雪":c<=82?"陣雨":c<=86?"陣雪":"雷雨";
let WX = null;
function wxFor(iso){ if(!WX||!WX.days) return null; return WX.days.find(d=>d.iso===iso)||null; }
async function loadWx(){
  if(!WX){ WX = store.get("wx", null); if(WX&&WX.days){ renderWx(); if(view==="day") renderDay(); } }
  // 每次重整都重抓；快取只在沒網路時當備援
  try{
    const get = async u => { const r = await fetch(u); if(!r.ok) throw 0; const j = await r.json(); if(!j.daily||!j.daily.time) throw 0; return j.daily; };
    const [ai, bm] = await Promise.all([get(WX_URL_AI).catch(()=>null), get(WX_URL_BM).catch(()=>null)]);
    const main = ai || bm; if(!main) return;
    const bmAt = iso => bm ? bm.time.indexOf(iso) : -1;
    WX = {at:Date.now(), src: ai ? "ECMWF AIFS" : "Open-Meteo", days: main.time.map((iso,i)=>{
      const j = bmAt(iso);
      const code = (main.weather_code&&main.weather_code[i]!=null) ? main.weather_code[i] : (j>=0 ? bm.weather_code[j] : 3);
      return {iso, code, hi:Math.round(main.temperature_2m_max[i]), lo:Math.round(main.temperature_2m_min[i]), rain: j>=0 ? bm.precipitation_probability_max[j] : null, mm: main.precipitation_sum ? main.precipitation_sum[i] : null};
    })};
    store.set("wx", WX); renderWx(); if(view==="day") renderDay();
  }catch(e){}
}
function renderWx(){
  const el = $("#wx");
  const sel = DAYS[dayIdx].iso;
  el.innerHTML = DAYS.map(d=>{ const w = wxFor(d.iso);
    return `<button class="d ${d.iso===sel?"sel":""} ${d.iso===TODAY?"today":""} ${d.iso<TODAY?"past":""}" data-iso="${d.iso}" aria-pressed="${d.iso===sel}" title="${w?WX_TXT(w.code):"尚無預報"}"><span>${d.md}</span><span>${d.dow}</span><span class="i">${w?WX_ICON(w.code):"·"}</span><b>${w?w.hi+"°":"—"}</b><b style="opacity:.7">${w?w.lo+"°":""}</b><span class="r">${w&&w.rain!=null?"☔"+w.rain+"%":""}</span></button>`; }).join("");
  el.hidden = false;
  el.querySelectorAll("button.d").forEach(b=>b.onclick=()=>{ const i=DAYS.findIndex(x=>x.iso===b.dataset.iso); if(i>=0){ dayIdx=i; show("day"); window.scrollTo({top:0}); } });
}

let parkTick = null;
function bindPark(P){
  const root = $("#v-day");

const LISTS = [["buy","還沒買 🛒"],["week","出發前 7 天 📅"],...PACK.map(([g],i)=>["pack"+i,g]),["memo","備忘 📝"]];
const defaults = key => key==="memo" ? MEMOS.map(t=>({t})) : key==="buy" ? TODO_BUY.map(([b,s,l])=>({t:b,s,l})) : key==="week" ? TODO_WEEK.map(t=>({t})) : PACK[+key.slice(4)][1].map(t=>({t}));
function listItems(key){
  const st = store.get(key, {}); const done=st.done||{}, hidden=st.hidden||{}, extra=st.extra||[];
  const items = defaults(key).map((it,i)=>({id:"d"+i,...it})).concat(extra.map(e=>({id:e.id,t:e.t,custom:true})));
  const text=st.text||{};
  return items.filter(it=>!hidden[it.id]).map(it=>({...it,t:text[it.id]||it.t,done:!!done[it.id]}));
}
function saveList(key, fn){ const st = store.get(key, {done:{},extra:[],hidden:{}}); st.done=st.done||{}; st.extra=st.extra||[]; st.hidden=st.hidden||{}; st.text=st.text||{}; fn(st); store.set(key, st); }
