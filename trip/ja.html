<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日文會話</title>
<meta name="theme-color" content="#EEF3F7">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF3F7; --card:#FFFFFF; --ink:#18263A; --muted:#647387; --line:#D8E1EA; --sky-top:#CFE4F3;
  --forest:#3F7D5C; --forest-soft:#E1EFE6; --sky:#3C78B4; --sky-soft:#E0ECF7;
  --sun:#C9821C; --sun-soft:#FBEED6; --rose:#B8524F; --rose-soft:#F9E3E2;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1623; --card:#18222F; --ink:#E8EEF5; --muted:#93A2B5; --line:#283545; --sky-top:#16243A;
  --forest:#86C7A2; --forest-soft:#1C2E27; --sky:#8DBBE8; --sky-soft:#1A2A3C;
  --sun:#F0B455; --sun-soft:#33281A; --rose:#F0908D; --rose-soft:#3A2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1623; --card:#18222F; --ink:#E8EEF5; --muted:#93A2B5; --line:#283545; --sky-top:#16243A;
  --forest:#86C7A2; --forest-soft:#1C2E27; --sky:#8DBBE8; --sky-soft:#1A2A3C;
  --sun:#F0B455; --sun-soft:#33281A; --rose:#F0908D; --rose-soft:#3A2224; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(to bottom,var(--sky-top),var(--bg) 260px) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-inline:-16px;padding:8px 16px 10px;border-radius:0 0 20px 20px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px 0 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-size:.9rem}
h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;flex:1}
.slow{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.85rem;white-space:nowrap}
.slow[aria-pressed="true"]{background:var(--sky);color:#fff;border-color:var(--sky)}
.search{position:relative}
.search input{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 44px 0 44px;font-size:1rem}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:1.2rem;border-radius:50%}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:12px 4px 6px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.sec{font-family:var(--f-display);font-size:1.05rem;margin:14px 4px 2px;color:var(--muted)}
.p{background:var(--card);border-radius:20px;padding:12px 12px 12px 10px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 0 var(--line)}
.p.kid{box-shadow:0 2px 0 var(--line),inset 4px 0 0 var(--sun)}
.say{flex:none;width:52px;height:52px;border-radius:16px;border:0;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center}
.say.on{background:var(--sun)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zh{font-size:.95rem;color:var(--muted)}
.ja{font-family:var(--f-ja);font-size:1.25rem;line-height:1.4;font-weight:500;word-break:break-word}
.kana{font-size:.85rem;color:var(--muted);font-family:var(--f-ja)}
.note{font-size:.8rem;color:var(--sky);margin-top:2px}
.side{flex:none;display:flex;flex-direction:column;gap:4px}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.ic.fav[aria-pressed="true"]{color:var(--sun);border-color:var(--sun);background:var(--sun-soft)}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.warn{background:var(--rose-soft);color:var(--rose);border-radius:16px;padding:10px 14px;font-size:.9rem;margin-top:10px}
/* 給店員看：全螢幕大字 */
.show{position:fixed;inset:0;z-index:50;background:var(--card);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));gap:16px}
.show[hidden]{display:none}
.show .big{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.show .bja{font-family:var(--f-ja);font-size:clamp(1.9rem,8.5vw,3rem);line-height:1.35;font-weight:600;word-break:break-word}
.show .bzh{font-size:1.05rem;color:var(--muted)}
.show .bar{display:flex;gap:10px}
.show .bar button{min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 18px;font-size:1rem;display:flex;align-items:center;gap:6px}
.show .bar .play{background:var(--forest);color:#fff;border-color:var(--forest);flex:1;justify-content:center}
.show.rot .big{transform:rotate(180deg)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="row">
      <a class="back" href="./" aria-label="回到名古屋八日">‹ 行程</a>
      <h1>🗣️ 日文會話</h1>
      <button class="slow" id="slow" aria-pressed="false" title="放慢語速">🐢 慢速</button>
    </div>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="用中文搜尋：廁所、推車、過敏…" autocomplete="off" enterkeyhint="search" aria-label="搜尋會話">
      <button class="clr" id="clr" aria-label="清除" hidden>✕</button>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="分類"></div>
  </div>
  <div id="warn"></div>
  <div class="list" id="list"></div>
  <p class="hint" style="text-align:center;margin-top:24px">🟢 點左邊按鈕聽發音 · 📱 讓店員看大字 · ⭐ 收藏常用句<br>發音用手機內建語音，第一次可能要等一下下。</p>
</div>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="給店員看">
  <div class="big"><div class="bja" id="bja"></div><div class="bzh" id="bzh"></div></div>
  <div class="bar">
    <button class="play" id="bplay">🔊 播放</button>
    <button id="brot" aria-label="翻轉畫面給對面的人看">🔄 翻轉</button>
    <button id="bclose">關閉</button>
  </div>
</div>

  ["fav","⭐ 收藏"],["basic","👋 基本"],["kid","👧 帶小孩"],["air","✈️ 機場出入境"],["way","🧭 問路"],["move","🚇 交通"],["taxi","🚕 計程車"],
  ["food","🍜 吃飯"],["shop","🛍️ 購物"],["hotel","🏨 飯店"],["park","🎢 樂園景點"],["sos","🆘 緊急"],["num","🔢 數字"]

{c:"num",zh:"四、五、六",ja:"よん、ご、ろく",k:"yon, go, roku"},
{c:"num",zh:"七、八、九、十",ja:"なな、はち、きゅう、じゅう",k:"nana, hachi, kyū, jū"},
{c:"num",zh:"一個、兩個、三個（點餐數量）",ja:"ひとつ、ふたつ、みっつ",k:"hitotsu, futatsu, mittsu",kw:"數量"},
{c:"num",zh:"一位、兩位、三位",ja:"ひとり、ふたり、さんにん",k:"hitori, futari, sannin",kw:"人數"},
{c:"num",zh:"100 日圓",ja:"百円",k:"hyaku en",kw:"錢"},
{c:"num",zh:"1000 日圓",ja:"千円",k:"sen en",kw:"錢"},
{c:"num",zh:"幾點？",ja:"何時ですか？",k:"nanji desu ka",kw:"時間"},
];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FAV=new Set(), slow=false, cat="basic";
try{FAV=new Set(JSON.parse(localStorage.getItem("trip-ja-fav")||"[]"))}catch(e){}
try{slow=localStorage.getItem("trip-ja-slow")==="1"}catch(e){}
try{const c=localStorage.getItem("trip-ja-cat"); if(c && CATS.some(x=>x[0]===c)) cat=c}catch(e){}
const saveFav=()=>{try{localStorage.setItem("trip-ja-fav",JSON.stringify([...FAV]))}catch(e){}};
P.forEach((p,i)=>p.id=p.c+":"+p.ja);

// 發音
let voice=null;
function pickVoice(){ if(!("speechSynthesis" in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); voice=vs.find(v=>/Kyoko|O-ren|Google|Nanami|Haruka/i.test(v.name))||vs[0]||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
let playing=null;
function speak(text,btn){
  if(!("speechSynthesis" in window)){ $("#warn").innerHTML='<div class="warn">這支手機的瀏覽器不支援語音，可以按 📱 讓對方看大字。</div>'; return; }
  speechSynthesis.cancel();
  document.querySelectorAll(".say.on").forEach(b=>b.classList.remove("on"));
  const u=new SpeechSynthesisUtterance(text.replace(/___/g,"、"));
  u.lang="ja-JP"; if(voice) u.voice=voice; u.rate=slow?0.6:0.9;
  if(btn){ btn.classList.add("on"); u.onend=u.onerror=()=>btn.classList.remove("on"); }
  speechSynthesis.speak(u);
}

// 搜尋：中文（含繁簡常見字）、日文、羅馬拼音都可
function norm(s){return String(s).toLowerCase().replace(/[\s、，,。？?！!／\/・]/g,"").replace(/[āáà]/g,"a").replace(/[ūú]/g,"u").replace(/[ōó]/g,"o").replace(/[ēé]/g,"e").replace(/[īí]/g,"i")}
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length)); }

const SPK='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function card(p,q){
  const i=P.indexOf(p);
  return `<div class="p${p.kid?" kid":""}">
    <button class="say" data-i="${i}" aria-label="播放日文：${esc(p.ja)}">${SPK}</button>
    <div class="tx"><div class="zh">${hl(p.zh,q)}</div><div class="ja" lang="ja">${hl(p.ja,q)}</div><div class="kana">${esc(p.k)}</div>${p.n?`<div class="note">💡 ${esc(p.n)}</div>`:""}</div>
    <div class="side"><button class="ic fav" data-f="${i}" aria-pressed="${FAV.has(p.id)}" aria-label="收藏">${FAV.has(p.id)?"★":"☆"}</button><button class="ic" data-s="${i}" aria-label="放大給對方看">📱</button></div>
  </div>`;
}
function renderTabs(){
  $("#tabs").innerHTML=CATS.map(([k,l])=>`<button data-c="${k}" aria-pressed="${!q()&&cat===k}">${l}${k==="fav"&&FAV.size?" "+FAV.size:""}</button>`).join("");
}
const q=()=>$("#q").value.trim();
function render(){
  const qs=q(); $("#clr").hidden=!qs; renderTabs();
  let html="";
  if(qs){
    const n=norm(qs);
    const hits=P.filter(p=>norm(p.zh+p.ja+p.k+(p.kw||"")+(p.n||"")).includes(n));
    html=hits.length?`<p class="hint">找到 ${hits.length} 句</p>`+hits.map(p=>card(p,qs)).join(""):`<div class="empty">找不到「${esc(qs)}」😅<br>換個說法試試，例如「錢」「車」「痛」</div>`;
  }else if(cat==="fav"){
    const f=P.filter(p=>FAV.has(p.id));
    html=f.length?f.map(p=>card(p)).join(""):`<div class="empty">還沒有收藏 ⭐<br>點句子右邊的星星，常用句就會集中在這裡。</div>`;
  }else{
    html=P.filter(p=>p.c===cat).map(p=>card(p)).join("");
  }
  $("#list").innerHTML=html;
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-c]"); if(!b) return; cat=b.dataset.c; $("#q").value=""; try{localStorage.setItem("trip-ja-cat",cat)}catch(_){} render(); window.scrollTo({top:0});});
$("#q").addEventListener("input",render);
$("#clr").addEventListener("click",()=>{$("#q").value="";render();$("#q").focus();});
$("#list").addEventListener("click",e=>{
  const s=e.target.closest(".say"), f=e.target.closest("[data-f]"), b=e.target.closest("[data-s]");
  if(s) speak(P[s.dataset.i].ja,s);
  if(f){ const p=P[f.dataset.f]; FAV.has(p.id)?FAV.delete(p.id):FAV.add(p.id); saveFav(); f.setAttribute("aria-pressed",FAV.has(p.id)); f.textContent=FAV.has(p.id)?"★":"☆"; renderTabs(); }
  if(b) openShow(P[b.dataset.s]);
});
const slowBtn=$("#slow");
slowBtn.setAttribute("aria-pressed",slow);
slowBtn.addEventListener("click",()=>{slow=!slow; slowBtn.setAttribute("aria-pressed",slow); try{localStorage.setItem("trip-ja-slow",slow?"1":"0")}catch(e){}});
let cur=null;
function openShow(p){cur=p; $("#bja").textContent=p.ja; $("#bzh").textContent=p.zh; $("#show").classList.remove("rot"); $("#show").hidden=false;}
$("#bplay").onclick=()=>cur&&speak(cur.ja);
$("#brot").onclick=()=>$("#show").classList.toggle("rot");
$("#bclose").onclick=()=>{$("#show").hidden=true; try{speechSynthesis.cancel()}catch(e){}};
document.addEventListener("keydown",e=>{if(e.key==="Escape") $("#show").hidden=true;});
render();
try{ if("serviceWorker" in navigator && location.protocol==="https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("../sw.js"); }catch(e){}
</script>
</body>
</html>
