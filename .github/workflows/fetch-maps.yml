name: fetch-maps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-maps.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download map images into maps/
        run: |
          set -e
          mkdir -p maps
          C=https://ghibli-family-day-nov12.kevindustglow.chatgpt.site
          for n in all bus catall catroute east forest north south west; do
            curl -fsSL -A "Mozilla/5.0" -o maps/$n.webp "$C/assets/thumbs/$n.webp" || echo "FAIL $n"
          done
          curl -fsSL -A "Mozilla/5.0" -o maps/park.png "https://www.aichi-koen.com/wp-content/uploads/2026/08/map202604.png" || echo "FAIL park"
          curl -fsSL -A "Mozilla/5.0" -o maps/busmap.jpg "https://www.aichi-koen.com/wp-content/uploads/2025/03/%E3%83%90%E3%82%B9%E3%83%9E%E3%83%83%E3%83%97.jpg" || echo "FAIL busmap"
          echo "--- app.js context ---"
          curl -fsSL "$C/app.js" -o /tmp/app.js
          grep -oE '.{0,120}east-route-timetable-zh\.png.{0,60}' /tmp/app.js | head -3 || true
          grep -oE '(base|dir|path|prefix)[A-Za-z]*\s*[:=]\s*["'"'"'`][^"'"'"'`]+' /tmp/app.js | head || true
          mkdir -p maps/full
          for f in catbus-forest-zh.png catbus-north-zh.png catbus-overview-zh.png catbus-route-zh.png east-route-timetable-zh.png forest-loop-zh.png forest-user-original.png official-catbus-forest-detail.png official-catbus-north-detail.png official-catbus-route.png official-catbus-stops.png park-bus-map-zh.png park-bus-user-original.png park-map-pluswei.webp west-route-timetable-zh.png; do
            for pre in assets/maps assets assets/full assets/images assets/img maps images img .; do
              if curl -fsSL -A "Mozilla/5.0" -o /tmp/x "$C/$pre/$f" && file /tmp/x | grep -qiE 'image|RIFF'; then
                mv /tmp/x maps/full/$f; echo "OK $pre/$f"; break; fi
            done
            [ -f maps/full/$f ] || echo "MISS $f"
          done
          ls -la maps maps/full; file maps/full/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add maps
          git diff --cached --quiet || git commit -m "Add map images to repo"
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
